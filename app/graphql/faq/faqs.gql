query Faqs($locale: I18NLocaleCode) {
  faqs(locale: $locale, sort: ["order:asc", "createdAt:asc"], pagination: { limit: 1000 }) {
    documentId
    title
    description
    order
    faq_category {
      documentId
      title
      order
      manual {
        documentId
        title
      }
    }
  }
}
