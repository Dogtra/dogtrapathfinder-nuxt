query BlogCategories {
  blogCategories(sort: "order:asc", pagination: { limit: 1000 }) {
    documentId
    title
    order
    color
    manual {
      documentId
      slug
      title
      hidden
      tag
    }
    articles(sort: "order:asc", pagination: { limit: 1000 }) {
      documentId
      uuid
      title
      content
      content_plain_text
      view_count
      order
      youtube_url
    }
  }
}
