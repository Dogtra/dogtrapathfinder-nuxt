[build]
  command = "yarn generate"
  # Nuxt auto-selects the netlify-static preset on Netlify, which writes to dist/
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Posts a "netlify/production" GitHub commit status when a production build
# fails, which triggers the Claude deploy-failure triage routine.
[[plugins]]
  package = "./netlify/plugins/deploy-failure-status"
